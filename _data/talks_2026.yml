  - date: "2026.06.25"
    start: "15:00"
    end: "16:00"
    is_upcoming: false
    details:
      - time: "15:05"
        title: "The Next Generation of Clinical Feedback Systems for Personalised Psychological Therapy"
        speaker: "Dr. Antonia Vehlen (Research Associate in Clinical Psychology and Psychotherapy at the University of Trier, Germany)"
        affiliation: "University of Trier"
        abstract: "Despite decades of psychotherapy research and the development of increasingly refined treatment packages, a substantial proportion of patients still does not benefit sufficiently from psychological therapy. One promising way forward is data-driven treatment personalization through routine monitoring, clinical feedback, and decision support systems. Such systems show small but robust additive effects, yet their clinical value depends on whether feedback is actually integrated into therapeutic practice. This talk presents the Trier Treatment Navigator (TTN) as a prospectively evaluated feedback system designed to support personalized treatment planning and process monitoring in outpatient psychological therapy. Building on evidence that feedback is most useful when it becomes part of therapists’ clinical reasoning and decision-making, the talk outlines two complementary directions for the next generation of feedback systems. The first direction focuses on the same core modality but improved implementation: making feedback more feasible, flexible, and useful for therapists in routine outpatient care, including private practice settings. A current implementation project will be presented, including its study design and first preliminary data. The second direction focuses on richer modalities and better clinical insight. Here, I will present an ongoing SMART-study in the university outpatient clinic at Trier University that integrates LLM-based ratings, LLM-generated summaries, EMA, and other AI-supported feedback elements to improve early treatment recommendations, support case conceptualization, and enrich feedback during the course of therapy. Together, these projects demonstrate how feedback systems can develop from basic monitoring tools into adaptable clinical feedback infrastructures that keep pace with recent AI advances while prioritising therapist support and personalised patient care."
  - date: "2026.03.26"
    start: "15:00"
    end: "16:00"
    is_upcoming: false
    details:
      - time: "15:05"
        title: "Voice-Based Psychiatric Assessment in the Real World"
        speaker: "George Fairs (Machine Learning Researcher, thymia) and Stefano Goria (Chief Technology Officer & Co-Founder, thymia)"
        affiliation: "thymia"
        abstract: "We present a multimodal Bayesian network for symptom-level prediction of depression and anxiety from speech and voice data, developed and deployed as a real-world clinical product and evaluated on over 30,000 unique speakers. The model integrates paralinguistic and linguistic features through symptom-specific surrogate models into a joint Bayesian network that learns posterior distributions over individual symptom severities, inter-symptom relationships, and overall condition probabilities (depression ROC-AUC = 0.842, anxiety = 0.831; ECE ≤ 0.018). We examine multimodal integration, cross-channel redundancy, demographic fairness across multiple axes, direct clinician intervention in model predictions, and service user acceptability — arguing that Bayesian networks offer a principled, explainable, and intervenable framework for clinical translation of digital phenotyping."

  - date: "2026.02.19"
    start: "15:00"
    end: "15:50"
    is_upcoming: false
    details:
      - time: "15:05"
        title: "Causal machine learning for predicting treatment outcomes"
        speaker: "Stefan Feuerriegel (Full Professor and Director at Institute of AI in Management (LMU Munich), and a PI at the Munich Center for Machine Learning (MCML))"
        affiliation: "LMU Munich"
        abstract: "Causal machine learning (ML) offers flexible, data-driven methods for predicting treatment outcomes including efficacy and toxicity, thereby supporting the assessment and safety of drugs. A key benefit of causal ML is that it allows for estimating individualized treatment effects, so that clinical decision-making can be personalized to individual patient profiles. Causal ML can be used in combination with both clinical trial data and real-world data, such as clinical registries and electronic health records, but caution is needed to avoid biased or incorrect predictions. In this talk, we discuss the benefits of causal ML (relative to traditional statistical or ML approaches) and outline the key components and steps. Finally, we provide recommendations for the reliable use of causal ML and effective translation into the clinic."

  - date: "2026.01.22"
    start: "15:00"
    end: "15:50"
    is_upcoming: false
    details:
      - time: "15:05"
        title: "Structure and Psycho-social Safety as Language Models Move Closer to Human."
        speaker: "Aseem Srivastava (Postdoctoral Researcher, MBZUAI, UAE) and Zuhair Hasn Shaik (Research Engineer, MBZUAI, UAE)"
        affiliation: "MBZUAI, UAE"
        abstract: "The role of AI in social and mental wellbeing is undergoing a fundamental shift, from systems that mediate human interaction to systems that increasingly function as direct social counterparts (aka AI companions). This shift introduces a critical challenge: as AI moves closer to human, the cost of missing structure increases, and the question of social safety becomes important. Despite their ability, language models remain fragile in socially vulnerable contexts, largely because current architectures lack explicit and interpretable representations of human vulnerability. In the absence of such a structure, safety mechanisms based on output filtering or post-hoc moderation are insufficient, particularly in sensitive settings involving emotional support, cultural nuance, and longitudinal interaction. We argue that as AI systems transition from mediators to companions, safety must be ensured in interpretable, taxonomical representations of psychosocial states rather than surface-level control of generated text. Addressing this gap requires rethinking how vulnerability, risk, and social context are represented, evaluated, and constrained within language models, motivating a broader research agenda at the intersection of NLP, AI safety, and mental and social wellbeing. In this talk, we will outline this shift through empirical examples, discuss emerging failure modes and design principles for socially aligned language models, and highlight open research challenges for building systems that interact safely and responsibly with human vulnerability."
